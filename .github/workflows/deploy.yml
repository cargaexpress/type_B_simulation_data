name: Build and Deploy Type B Simulator to AWS ECR and EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-ec2:
    name: Deploy to AWS EC2 using GitHub Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate .env from GitHub Secrets
        run: |
          cat << 'EOF' > generate_env.py
          import os

          env_vars = {
              "POSTGRES_DB": os.environ.get("POSTGRES_DB", "carrier_a_db"),
              "POSTGRES_USER": os.environ.get("POSTGRES_USER", "carrier_a_user"),
              "POSTGRES_PASSWORD": os.environ.get("POSTGRES_PASSWORD", "local_postgres_password_123"),
              "MYSQL_DATABASE": os.environ.get("MYSQL_DATABASE", "carrier_b_db"),
              "MYSQL_USER": os.environ.get("MYSQL_USER", "carrier_b_user"),
              "MYSQL_PASSWORD": os.environ.get("MYSQL_PASSWORD", "local_mysql_password_123"),
              "MYSQL_ROOT_PASSWORD": os.environ.get("MYSQL_ROOT_PASSWORD", "local_mysql_root_password_123"),
              "MONGO_ROOT_USERNAME": os.environ.get("MONGO_ROOT_USERNAME", "carrier_c_admin"),
              "MONGO_ROOT_PASSWORD": os.environ.get("MONGO_ROOT_PASSWORD", "local_mongo_password_123"),
              "MONGO_DATABASE": os.environ.get("MONGO_DATABASE", "carrier_c_db"),
              "CARRIER_A_RATE_LIMIT": os.environ.get("CARRIER_A_RATE_LIMIT", "60"),
              "CARRIER_B_RATE_LIMIT": os.environ.get("CARRIER_B_RATE_LIMIT", "60"),
              "CARRIER_C_RATE_LIMIT": os.environ.get("CARRIER_C_RATE_LIMIT", "60"),
              "CARRIER_D_RATE_LIMIT": os.environ.get("CARRIER_D_RATE_LIMIT", "60"),
              "SEED": os.environ.get("SEED", "42"),
              "SEED_EVENTS_PER_CARRIER": os.environ.get("SEED_EVENTS_PER_CARRIER", "50000"),
              "EVENTS_PER_CARRIER_PER_CYCLE": os.environ.get("EVENTS_PER_CARRIER_PER_CYCLE", "10000"),
              "GENERATOR_INTERVAL_SECONDS": os.environ.get("GENERATOR_INTERVAL_SECONDS", "1800"),
              "RETENTION_DAYS": os.environ.get("RETENTION_DAYS", "3"),
              "DIRTY_RATE": os.environ.get("DIRTY_RATE", "0.10"),
          }

          with open(".env", "w") as f:
              for k, v in env_vars.items():
                  f.write(f"{k}={v}\n")
          EOF

          python3 generate_env.py
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          MONGO_DATABASE: ${{ secrets.MONGO_DATABASE }}
          CARRIER_A_RATE_LIMIT: ${{ secrets.CARRIER_A_RATE_LIMIT }}
          CARRIER_B_RATE_LIMIT: ${{ secrets.CARRIER_B_RATE_LIMIT }}
          CARRIER_C_RATE_LIMIT: ${{ secrets.CARRIER_C_RATE_LIMIT }}
          CARRIER_D_RATE_LIMIT: ${{ secrets.CARRIER_D_RATE_LIMIT }}
          SEED: ${{ secrets.SEED }}
          SEED_EVENTS_PER_CARRIER: ${{ secrets.SEED_EVENTS_PER_CARRIER }}
          EVENTS_PER_CARRIER_PER_CYCLE: ${{ secrets.EVENTS_PER_CARRIER_PER_CYCLE }}
          GENERATOR_INTERVAL_SECONDS: ${{ secrets.GENERATOR_INTERVAL_SECONDS }}
          RETENTION_DAYS: ${{ secrets.RETENTION_DAYS }}
          DIRTY_RATE: ${{ secrets.DIRTY_RATE }}

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          ENV_CONTENT: ${{ hashFiles('.env') }}
        with:
          host: ${{ secrets.EC2_HOST || '3.129.10.158' }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ENV_CONTENT
          script: |
            echo "==> Configuring swap memory if not present..."
            if [ ! -f /swapfile ]; then
              sudo fallocate -l 2G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi

            echo "==> Ensuring Docker and Compose are installed..."
            if ! command -v docker &> /dev/null; then
              sudo apt-get update
              sudo apt-get install -y docker.io docker-compose-v2 git
              sudo usermod -aG docker ubuntu
            fi

            echo "==> Updating codebase on EC2..."
            if [ ! -d "$HOME/type_B_simulation_data" ]; then
              git clone https://github.com/cargaexpress/type_B_simulation_data.git "$HOME/type_B_simulation_data"
            fi
            cd "$HOME/type_B_simulation_data"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Writing .env from GitHub Secrets..."
            cat << 'ENVEOF' > .env
            POSTGRES_DB=${{ secrets.POSTGRES_DB || 'carrier_a_db' }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER || 'carrier_a_user' }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'local_postgres_password_123' }}
            MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE || 'carrier_b_db' }}
            MYSQL_USER=${{ secrets.MYSQL_USER || 'carrier_b_user' }}
            MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD || 'local_mysql_password_123' }}
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD || 'local_mysql_root_password_123' }}
            MONGO_ROOT_USERNAME=${{ secrets.MONGO_ROOT_USERNAME || 'carrier_c_admin' }}
            MONGO_ROOT_PASSWORD=${{ secrets.MONGO_ROOT_PASSWORD || 'local_mongo_password_123' }}
            MONGO_DATABASE=${{ secrets.MONGO_DATABASE || 'carrier_c_db' }}
            CARRIER_A_RATE_LIMIT=${{ secrets.CARRIER_A_RATE_LIMIT || '60' }}
            CARRIER_B_RATE_LIMIT=${{ secrets.CARRIER_B_RATE_LIMIT || '60' }}
            CARRIER_C_RATE_LIMIT=${{ secrets.CARRIER_C_RATE_LIMIT || '60' }}
            CARRIER_D_RATE_LIMIT=${{ secrets.CARRIER_D_RATE_LIMIT || '60' }}
            SEED=${{ secrets.SEED || '42' }}
            SEED_EVENTS_PER_CARRIER=${{ secrets.SEED_EVENTS_PER_CARRIER || '50000' }}
            EVENTS_PER_CARRIER_PER_CYCLE=${{ secrets.EVENTS_PER_CARRIER_PER_CYCLE || '10000' }}
            GENERATOR_INTERVAL_SECONDS=${{ secrets.GENERATOR_INTERVAL_SECONDS || '1800' }}
            RETENTION_DAYS=${{ secrets.RETENTION_DAYS || '3' }}
            DIRTY_RATE=${{ secrets.DIRTY_RATE || '0.10' }}
            ENVEOF

            echo "==> Starting Docker containers..."
            sudo docker compose up -d --build
            sudo docker compose ps

