events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    upstream carrier_a_upstream {
        server carrier_a:8000;
    }
    upstream carrier_b_upstream {
        server carrier_b:8000;
    }
    upstream carrier_c_upstream {
        server carrier_c:8000;
    }
    upstream carrier_d_upstream {
        server carrier_d:8000;
    }

    # Redirect HTTP traffic to HTTPS
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server with Let's Encrypt SSL
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/letsencrypt/live/cargaexpress-simulator-b.mooo.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cargaexpress-simulator-b.mooo.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        location /health {
            default_type application/json;
            return 200 '{"status":"ok","gateway":"healthy","carriers":["A","B","C","D"]}';
        }

        location /carrier-a/ {
            proxy_pass http://carrier_a_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Prefix /carrier-a;
        }

        location /carrier-b/ {
            proxy_pass http://carrier_b_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Prefix /carrier-b;
        }

        location /carrier-c/ {
            proxy_pass http://carrier_c_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Prefix /carrier-c;
        }

        location /carrier-d/ {
            proxy_pass http://carrier_d_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Prefix /carrier-d;
        }

        # =========================================================================
        # Type C Carriers (Batch Simulator Ports 8005, 8006, 8007)
        # =========================================================================
        location /carrier-1/ {
            proxy_pass http://172.17.0.1:8005/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Prefix /carrier-1;
        }

        location /carrier-2/ {
            proxy_pass http://172.17.0.1:8006/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Prefix /carrier-2;
        }

        location /carrier-3/ {
            proxy_pass http://172.17.0.1:8007/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Prefix /carrier-3;
        }

        # MinIO Web Console (Object Storage F5)
        location /minio/ {
            proxy_pass http://172.17.0.1:9001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
